name: Promotion Management CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: 1. Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: promotions_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar presencia de variables de entorno requeridas
        run: |
          echo "Verificando plantilla .env.example..."
          if [ ! -f .env.example ]; then
            echo "::error::El archivo .env.example no existe en el repositorio."
            exit 1
          fi

      - name: Instalar dependencias, Linter y Tests Backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: promotions_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        run: |
          cd backend
          pnpm install --frozen-lockfile
          pnpm run --if-present lint
          pnpm run --if-present test

      - name: Instalar dependencias, Linter y Tests Frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run --if-present lint
          pnpm run --if-present test

  docker-build:
    name: 2. Build Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar Imagen Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      - name: Compilar Imagen Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

  smoke-test:
    name: 3. Integration Smoke Test
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear archivo .env usando únicamente GitHub Secrets
        run: |
          cat <<EOF > .env
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
          EOF

      - name: Levantar servicios con Docker Compose
        run: docker compose up -d --build

      - name: Esperar disponibilidad de los servicios y verificar /health
        run: |
          echo "Esperando a que los contenedores inicien correctamente..."
          
          MAX_ATTEMPTS=12
          ATTEMPT=0
          HEALTH_URL="http://localhost:${{ secrets.BACKEND_PORT }}/health"

          until [ $ATTEMPT -ge $MAX_ATTEMPTS ]
          do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || true)
            echo "Intento $((ATTEMPT+1)): Respuesta de $HEALTH_URL -> HTTP $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Smoke test exitoso! El backend respondió HTTP 200 en /health"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT+1))
            sleep 5
          done

          echo "::error:: El backend no respondió HTTP 200 en $HEALTH_URL a tiempo."
          echo "--- LOGS DEL BACKEND ---"
          docker compose logs backend
          echo "--- LOGS DE POSTGRES ---"
          docker compose logs postgres
          exit 1

      - name: Apagar contenedores
        if: always()
        run: docker compose down -v